[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharedoc"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "docxtpl>=0.16.8",
  "psycopg2-binary>=2.9.9",
  "python-dotenv>=1.0.1",
]

[project.scripts]
sharedoc = "sharedoc.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
